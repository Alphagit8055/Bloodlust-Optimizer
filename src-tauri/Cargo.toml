[package]
name = "bloodlust-optimizer"
version = "0.1.0"
description = "Bloodlust Optimizer - emulator and Windows performance tuning"
authors = ["Telegram: @Alpha0NemesiSS"]
edition = "2021"
license = "MIT"

# The protocol, catalog verification and sidecar client all live in the
# `bridge` crate, which is tested independently on Linux CI. This binary is
# intentionally thin: state, commands, and windowing.

[lib]
name = "bloodlust_optimizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

bloodlust-bridge = { path = "../bridge", features = ["http"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
